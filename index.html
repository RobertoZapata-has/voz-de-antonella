<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La voz de Antonella</title>
<meta name="theme-color" content="#1d5c63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Tablero de comunicación: pantalla fija, sin scroll; marcos negros gruesos como los pictogramas de terapia */
:root{
  --bg:#e8eeec; --bg-2:#dbe4e1; --ink:#13191c; --muted:#56676a; --tile:#ffffff;
  --accent:#1d5c63; --accent-ink:#ffffff; --sun:#f2c230; --ok:#2f8f5b; --warn:#c2412d;
  --frame:5px;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
img{-webkit-user-drag:none;max-width:100%}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column}

/* barra superior */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 14px 6px}
.tabs{display:flex;gap:10px;flex:1}
.tab{border:3px solid var(--ink);background:var(--tile);border-radius:14px;padding:8px 22px;font-size:22px;font-weight:700;
  display:flex;align-items:center;gap:10px;min-height:56px}
.tab svg{width:28px;height:28px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.who{font-size:18px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.gear{position:relative;width:56px;height:56px;border-radius:50%;border:none;background:transparent;color:var(--muted);
  display:grid;place-items:center}
.gear svg{width:28px;height:28px;position:relative}
.gear .ring{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),transparent 0)}
.gear .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}

/* vista hablar */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.msg{height:clamp(84px,17vh,150px);margin:4px 14px 10px;border-radius:16px;background:var(--tile);border:3px solid var(--ink);
  display:flex;align-items:center;gap:18px;padding:8px 18px;border-style:dashed;border-color:var(--muted)}
.msg.has{border-style:solid;border-color:var(--ink)}
.msg img{height:100%;aspect-ratio:1;object-fit:contain}
.msg .txt{font-size:clamp(24px,4.4vh,42px);font-weight:700;line-height:1.15;flex:1;text-wrap:balance}
.msg .hint{color:var(--muted);font-weight:400}
.msg .again{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);display:grid;place-items:center;flex:none}
.msg .again svg{width:32px;height:32px}
.boardwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 14px 14px;gap:10px}
.board{flex:1;min-height:0;display:grid;gap:clamp(12px,2vmin,24px);touch-action:none}
.tile{position:relative;background:var(--tile);border:var(--frame) solid var(--ink);border-radius:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px;min-height:0;min-width:0;overflow:hidden;transition:transform .12s ease,box-shadow .12s ease}
.tile .pic{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.tile .pic img{max-width:100%;max-height:100%;object-fit:contain}
.tile .lbl{font-size:clamp(17px,2.6vh,28px);font-weight:700;line-height:1.1;text-align:center;padding:4px 2px 2px;flex:none}
.tile.noimg .pic{font-size:clamp(26px,5vh,52px);font-weight:700;text-align:center}
.tile.press{box-shadow:0 0 0 6px var(--sun);transform:scale(.97)}
.tile.fire{animation:fire .5s ease}
@keyframes fire{0%{box-shadow:0 0 0 0 var(--sun)}40%{box-shadow:0 0 0 12px var(--sun);transform:scale(1.03)}100%{box-shadow:0 0 0 0 transparent}}
.tile.empty{visibility:hidden}
.tile.folder{box-shadow:7px 7px 0 0 var(--ink);margin:0 7px 7px 0}
.tile.folder .lbl::after{content:" ›"}
.tile.folder.press{box-shadow:7px 7px 0 0 var(--ink),0 0 0 6px var(--sun)}
.tile.backtile{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.backtile .pic svg{height:60%;max-height:120px;width:auto}
.pager{display:flex;justify-content:center;align-items:center;gap:20px;font-size:20px;font-weight:700}
.pager button{border:3px solid var(--ink);background:var(--tile);border-radius:14px;width:120px;height:56px;font-size:26px}
.pager button:disabled{opacity:.3}

/* juegos */
.games{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:10px 14px 18px}
.gcard{border:var(--frame) solid var(--ink);border-radius:18px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
.gcard .art{display:flex;gap:8px;align-items:center;justify-content:center;height:45%;width:100%}
.gcard .art img{height:min(100%,24vh);width:auto;aspect-ratio:1;max-width:45%;object-fit:contain;border:3px solid var(--ink);border-radius:4px;background:#fff;padding:4px}
.gcard h2{margin:0;font-size:clamp(24px,4vh,40px)}
.gcard p{margin:0;color:var(--muted);font-size:clamp(16px,2.3vh,22px);text-align:center}
.play{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 14px 14px;gap:12px;position:relative}
.playbar{display:flex;align-items:center;gap:14px}
.back{border:3px solid var(--ink);background:var(--tile);border-radius:14px;min-height:56px;padding:6px 18px;font-weight:700;font-size:20px;display:flex;gap:8px;align-items:center}
.back svg{width:24px;height:24px}
.dots{display:flex;gap:10px;margin-left:auto}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:var(--tile)}
.dots i.on{background:var(--sun)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,30px)}
.target{height:34%;aspect-ratio:1;border:var(--frame) dashed var(--ink);border-radius:10px;background:var(--tile);display:flex;align-items:center;justify-content:center;padding:10px}
.target img{max-width:100%;max-height:100%;object-fit:contain}
.ask{font-size:clamp(26px,5vh,46px);font-weight:700;display:flex;align-items:center;gap:16px;text-align:center}
.ask b{background:var(--sun);padding:0 12px;border-radius:8px}
.ask button{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);display:grid;place-items:center;flex:none}
.ask button svg{width:32px;height:32px}
.opts{display:flex;gap:clamp(20px,5vw,70px);justify-content:center;height:46%;width:100%;touch-action:none}
.opts .tile{height:100%;aspect-ratio:1}
.tile.ok{box-shadow:0 0 0 10px var(--ok);animation:bounce .5s ease}
.tile.dim{opacity:.35;transition:opacity .3s}
.tile.nope{animation:shake .4s ease}
.tile.hint{animation:pulse 1s ease-in-out infinite}
@keyframes bounce{40%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{50%{box-shadow:0 0 0 12px var(--sun);transform:scale(1.04)}}
.bubbles{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:18px;background:var(--bg-2);touch-action:none}
.bubble{position:absolute;border-radius:50%;background:var(--tile);border:var(--frame) solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;will-change:transform}
.bubble img{width:70%;height:70%;object-fit:contain;pointer-events:none}
.bubble span{font-size:28px;font-weight:700;pointer-events:none}
.bubble.pop{animation:pop .45s ease forwards}
@keyframes pop{60%{transform:var(--t) scale(1.25);opacity:1}100%{transform:var(--t) scale(.2);opacity:0}}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.done .star{width:min(30vh,240px);height:min(30vh,240px)}
.done h2{margin:0;font-size:clamp(32px,6vh,56px)}
.done .row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.big{border:3px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:16px;min-height:72px;padding:10px 30px;font-size:24px;font-weight:700}
.big.alt{background:var(--tile);color:var(--ink)}
.spark{position:fixed;pointer-events:none;width:18px;height:18px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);z-index:50;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* ajustes */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;-webkit-user-select:text;user-select:text;touch-action:auto;
  padding:max(14px,env(safe-area-inset-top,0)) max(16px,env(safe-area-inset-right,0)) 40px max(16px,env(safe-area-inset-left,0))}
.sheet .inner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sheethead{display:flex;align-items:center;gap:14px;position:sticky;top:-14px;background:var(--bg);padding:10px 0;z-index:2}
.sheethead h1{margin:0;font-size:28px;flex:1}
.sec{background:var(--tile);border-radius:14px;border:2px solid var(--bg-2);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:20px}
.sec p.note{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:6px;border-radius:10px;background:var(--bg)}
.prow img,.prow .ph{width:56px;height:56px;object-fit:contain;background:#fff;border:3px solid var(--ink);border-radius:4px;flex:none}
.prow .ph{display:grid;place-items:center;font-size:12px;font-weight:700;text-align:center}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-size:18px}
.prow .t small{display:block;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow.off{opacity:.5}
.sbtn{border:2px solid var(--ink);background:var(--tile);border-radius:10px;min-height:44px;min-width:44px;padding:6px 12px;font-size:16px;font-weight:700}
.sbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sbtn.danger{color:var(--warn);border-color:var(--warn)}
.sbtn:disabled{opacity:.35}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:16px}
.field input[type=text],.field input[type=search],.field select{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.field input:focus-visible,.sbtn:focus-visible,.tab:focus-visible,.big:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:8px 14px;font-size:17px;font-weight:700;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:340px;overflow:auto}
.results button{background:#fff;border:3px solid var(--bg-2);border-radius:8px;padding:4px;aspect-ratio:1}
.results button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.results img{width:100%;height:100%;object-fit:contain}
.preview{width:140px;height:140px;border:var(--frame) solid var(--ink);border-radius:6px;background:#fff;display:grid;place-items:center;padding:6px}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.credit{font-size:14px;color:var(--muted);line-height:1.45}
.credit a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:60;font-size:17px}

/* puerta de ajustes */
.gate{position:fixed;inset:0;background:rgba(19,25,28,.55);z-index:40;display:grid;place-items:center;padding:16px}
.gatebox{background:var(--tile);border-radius:18px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;align-items:center}
.gatebox h2{margin:0;font-size:22px;text-align:center}
.gatebox .q{font-size:34px;font-weight:700}
.gatebox .ans{font-size:30px;font-weight:700;min-height:44px;letter-spacing:.1em}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.keys button{height:60px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:24px;font-weight:700}

@media (orientation:portrait){
  .games{grid-template-columns:1fr}
  .gcard{flex-direction:row;justify-content:flex-start}
  .gcard .art{height:100%;width:40%}
  .opts{flex-wrap:wrap;height:auto}
  .opts .tile{height:auto;width:40vw}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <nav class="tabs" role="tablist">
      <button class="tab" id="tabTalk" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Hablar</button>
      <button class="tab" id="tabPlay" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3"/><circle cx="15.5" cy="11.5" r=".6" fill="currentColor"/><circle cx="17.5" cy="13.5" r=".6" fill="currentColor"/></svg>Jugar</button>
    </nav>
    <span class="who" id="who"></span>
    <button class="gear" id="gear" aria-label="Ajustes (mantener presionado)">
      <span class="ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="view" id="talkView">
    <div class="msg" id="msg">
      <div class="txt hint" id="msgTxt">Tocá un dibujo para hablar</div>
    </div>
    <div class="boardwrap">
      <div class="board" id="board"></div>
      <div class="pager" id="pager" hidden>
        <button id="prevPage" aria-label="Página anterior">◀</button>
        <span id="pageInfo"></span>
        <button id="nextPage" aria-label="Página siguiente">▶</button>
      </div>
    </div>
  </section>

  <section class="view" id="playView" hidden></section>
</div>

<div class="gate" id="gate" hidden>
  <div class="gatebox">
    <h2>Ajustes para la familia</h2>
    <div class="q" id="gateQ"></div>
    <div class="ans" id="gateA">&nbsp;</div>
    <div class="keys" id="gateKeys"></div>
    <div class="row2"><button class="sbtn" id="gateCancel">Cancelar</button></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

}

const DATA_VERSION = 2;
const DEFAULT_SETTINGS = {name:'Antonella', cols:4, rows:3, showLabels:true, voiceURI:'', rate:0.9,
  lockMs:800, showGames:true, options:2, rounds:5, hair:'blonde'};

function blankPicto(p){ return {...p, src:{...p.src}, img:'', audio:'', hidden:false, games:!p.folder}; }
function freshPictos(){ return DEFAULT_PICTOS.map(blankPicto); }
/* actualiza lo guardado en la tablet sin perder fotos ni grabaciones */
function migrate(list, from){
  if (from < 2){
    list = list.filter(p => p.id !== 'mama');
    if (!list.some(p => p.id === 'familia')) list.push(blankPicto(DEFAULT_PICTOS.find(p => p.id === 'familia')));
    const papa = list.find(p => p.id === 'papa'); if (papa) papa.in = 'familia';
    for (const id of ['roberto','gabriela','jesica','gonzalo','abuela'])
      if (!list.some(p => p.id === id)) list.push(blankPicto(DEFAULT_PICTOS.find(p => p.id === id)));
  }
  return list;
}

/* ---------- almacenamiento (IndexedDB con respaldo en memoria) ---------- */
const store = (() => {
  let dbp = null; const mem = {};
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try{
        const r = indexedDB.open('voz-antonella', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  return {
    async get(k){ const db = await open(); if(!db) return mem[k];
      return new Promise(res => { try{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(mem[k]); }catch(e){ res(mem[k]); } }); },
    async set(k,v){ mem[k]=v; const db = await open(); if(!db) return;
      return new Promise(res => { try{ const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){ res(); } }); }
  };
})();

let pictos = [], settings = {...DEFAULT_SETTINGS};
async function load(){
  const p = await store.get('pictos'); const s = await store.get('settings');
  settings = {...DEFAULT_SETTINGS, ...(s||{})};
  if (Array.isArray(p) && p.length){
    pictos = p;
    const v = settings.dataVersion || 1;
    if (v < DATA_VERSION){ pictos = migrate(pictos, v); settings.dataVersion = DATA_VERSION; await savePictos(); await saveSettings(); }
  } else { pictos = freshPictos(); settings.dataVersion = DATA_VERSION; }
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
}
const savePictos = () => store.set('pictos', pictos);
const saveSettings = () => store.set('settings', settings);

/* ---------- imágenes ---------- */
function imgFor(p){
  if (p.img) return p.img;
  if (p.src.type === 'embedded') return EMB[p.src.key];
  if (p.src.type === 'arasaac') return arasaacUrl(p.src.id, p.src.hair ? settings.hair : '');
  return '';
}
function makeImg(p){
  const url = imgFor(p); if(!url) return null;
  const im = new Image(); im.alt = ''; im.draggable = false; im.decoding = 'async'; im.src = url;
  im.onerror = () => {
    if (p.src.type === 'arasaac' && im.src !== arasaacStatic(p.src.id)) { im.src = arasaacStatic(p.src.id); return; }

let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)); }catch(e){ voices=[]; } }
function pickVoice(){
  if (!voices.length) loadVoices();
  if (settings.voiceURI){ const v = voices.find(v=>v.voiceURI===settings.voiceURI); if (v) return v; }
  const order = ['es-AR','es-US','es-419','es-MX','es-CO','es-CL','es-ES'];
  for (const l of order){ const v = voices.find(v => v.lang.replace('_','-').toLowerCase() === l.toLowerCase()); if (v) return v; }
  return voices[0] || null;
}
let currentAudio = null;
function say(text, audio){
  try{ speechSynthesis.cancel(); }catch(e){}
  if (currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  if (audio){ currentAudio = new Audio(audio); currentAudio.play().catch(()=>speak(text)); return; }
  speak(text);
}
function speak(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'es-AR';
    u.rate = settings.rate; u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

let actx = null;
function chime(kind){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'win' ? [523.25,659.25,783.99,1046.5] : [659.25,880];
    notes.forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain(); const t = actx.currentTime + i*0.11;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.55);
    });
  }catch(e){}
}
function sparks(el){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(); const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (let i=0;i<12;i++){
    const s = document.createElement('i'); s.className='spark'; const a = i/12*Math.PI*2, d = 90 + Math.random()*70;
    s.style.left = cx+'px'; s.style.top = cy+'px'; s.style.setProperty('--dx', Math.cos(a)*d+'px'); s.style.setProperty('--dy', Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(), 900);
  }
}

/* ---------- toques: se activa al levantar el dedo, ignora la palma y los toques repetidos ---------- */
function touchArea(area, selector, onFire, opts={}){
  const down = new Map(); let multi = false; let lockUntil = 0; let pressed = null;
  const under = (x,y) => { const el = document.elementFromPoint(x,y); return el && el.closest(selector) && area.contains(el) ? el.closest(selector) : null; };
  const setPressed = el => { if (pressed === el) return; pressed && pressed.classList.remove('press'); pressed = el; el && !opts.noPress && el.classList.add('press'); };
  area.addEventListener('pointerdown', e => {
    down.set(e.pointerId, Date.now()); if (down.size > 1){ multi = true; setPressed(null); return; }
    try{ area.setPointerCapture(e.pointerId); }catch(_){}
    setPressed(under(e.clientX, e.clientY));
  });
  area.addEventListener('pointermove', e => { if (!down.has(e.pointerId) || multi) return; setPressed(under(e.clientX, e.clientY)); });
  const end = (e, cancel) => {
    if (!down.has(e.pointerId)) return;
    const t0 = down.get(e.pointerId); down.delete(e.pointerId);
    const el = under(e.clientX, e.clientY); setPressed(null);
    if (multi){ if (!down.size) multi = false; return; }
    if (cancel || !el) return;
    if (Date.now() - t0 > 5000) return;             // mano apoyada mucho rato
    if (Date.now() < lockUntil) return;             // toques repetidos
    lockUntil = Date.now() + (opts.lock ? opts.lock() : settings.lockMs);
    onFire(el, e);
  };
  area.addEventListener('pointerup', e => end(e,false));
  area.addEventListener('pointercancel', e => end(e,true));
}

let bubbleRAF = 0;
function stopBubbles(){ cancelAnimationFrame(bubbleRAF); bubbleRAF = 0; }
function startBubbles(){
  const {stage, wrap} = playShell(); stage.remove();
  const area = document.createElement('div'); area.className='bubbles'; wrap.appendChild(area);
  const pool = gamePool(); const items = []; const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let deck = [];
  const nextPicto = () => { if (!deck.length) deck = shuffle(pool); return deck.pop(); };
  function spawn(){
    const W = area.clientWidth, H = area.clientHeight; const size = Math.round(Math.min(W,H) * 0.36);
    const p = nextPicto(); const el = document.createElement('div'); el.className='bubble'; el.dataset.id = p.id;
    el.style.width = el.style.height = size+'px';
    const im = makeImg(p); if (im) el.appendChild(im); else { const s=document.createElement('span'); s.textContent=p.label; el.appendChild(s); }
    let x, y, tries = 0;
    do { x = Math.random()*(W-size); y = Math.random()*(H-size); tries++; }
    while (tries < 30 && items.some(b => Math.hypot(b.x-x, b.y-y) < size*1.05));
    const sp = reduce ? 0 : 0.35 + Math.random()*0.25, a = Math.random()*Math.PI*2;
    const b = {el, p, x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, size, alive:true};
    items.push(b); area.appendChild(el); place(b);
  }
  function place(b){ const t = `translate(${b.x}px,${b.y}px)`; b.el.style.transform = t; b.el.style.setProperty('--t', t); }
  function tick(){
    const W = area.clientWidth, H = area.clientHeight;
    for (const b of items){ if (!b.alive) continue;
      b.x += b.vx; b.y += b.vy;
      if (b.x < 0){ b.x=0; b.vx=Math.abs(b.vx); } if (b.x > W-b.size){ b.x=W-b.size; b.vx=-Math.abs(b.vx); }
      if (b.y < 0){ b.y=0; b.vy=Math.abs(b.vy); } if (b.y > H-b.size){ b.y=H-b.size; b.vy=-Math.abs(b.vy); }
      place(b);
    }
    bubbleRAF = requestAnimationFrame(tick);
  }
  requestAnimationFrame(() => { const n = Math.min(3, pool.length); for (let i=0;i<n;i++) spawn(); stopBubbles(); tick(); });
  touchArea(area, '.bubble', el => {
    const b = items.find(x => x.el === el); if (!b || !b.alive) return;
    b.alive = false; el.classList.add('pop'); chime('ok'); sparks(el);
    say(b.p.label, b.p.audio);
    setTimeout(() => { el.remove(); items.splice(items.indexOf(b),1); if (bubbleRAF) spawn(); }, 900);
  }, {noPress:true, lock:()=>500});
}

        h('button',{class:'sbtn', 'aria-label':'Subir', disabled: i===0, on:{click:()=>{ [pictos[i-1],pictos[i]]=[pictos[i],pictos[i-1]]; savePictos(); drawList(); }}}, '▲'),
        h('button',{class:'sbtn', 'aria-label':'Bajar', disabled: i===pictos.length-1, on:{click:()=>{ [pictos[i+1],pictos[i]]=[pictos[i],pictos[i+1]]; savePictos(); drawList(); }}}, '▼'),
        h('button',{class:'sbtn', on:{click:()=>{ p.hidden=!p.hidden; savePictos(); drawList(); }}}, p.hidden?'Mostrar':'Ocultar'),
        h('button',{class:'sbtn pri', on:{click:()=>openEditor(p, drawList)}}, 'Editar')
      ));
    });
  };
  drawList();
  inner.appendChild(h('section',{class:'sec'},
    h('h2',{},'Pictogramas'),
    h('p',{class:'note'},'El orden de la lista es el orden en el tablero, de izquierda a derecha y de arriba hacia abajo. Conviene no cambiar de lugar los que ya conoce: así aprende dónde está cada uno.'),
    list,
    h('div',{class:'row2'}, h('button',{class:'sbtn pri', on:{click:()=>{ const p={id:'p'+Date.now().toString(36), label:'Nuevo', phrase:'', src:{type:'none'}, img:'', audio:'', hidden:false, games:true}; openEditor(p, drawList, true); }}}, '+ Agregar pictograma'))
  ));

  /* tablero */
  inner.appendChild(h('section',{class:'sec'},
    h('h2',{},'Tablero'),
    h('div',{class:'field'}, h('label',{},'Cantidad de dibujos por pantalla'),
      seg([['2x2','4 (2 × 2)'],['3x2','6 (3 × 2)'],['4x3','12 (4 × 3)'],['5x3','15 (5 × 3)']], `${settings.cols}x${settings.rows}`, v => { const [c,r]=v.split('x').map(Number); settings.cols=c; settings.rows=r; saveSettings(); })),
    h('p',{class:'note'},'Menos dibujos = botones más grandes y más fáciles de tocar. Si hay más pictogramas que lugares, aparecen flechas para pasar de página.'),
    h('div',{class:'field'}, h('label',{},'Texto debajo del dibujo'),
      seg([[true,'Mostrar'],[false,'Ocultar']], settings.showLabels, v => { settings.showLabels=v; saveSettings(); })),
    h('div',{class:'field'}, h('label',{},'Tiempo de espera entre toques'),
      seg([[500,'Corto'],[800,'Normal'],[1300,'Largo'],[2000,'Muy largo']], settings.lockMs, v => { settings.lockMs=v; saveSettings(); })),
    h('p',{class:'note'},'Después de un toque, la app ignora otros toques durante este tiempo. Sirve si toca dos veces sin querer o apoya la mano.'),
    h('div',{class:'field'}, h('label',{for:'nameIn'},'Nombre que aparece arriba'),
      h('input',{type:'text', id:'nameIn', value:settings.name, on:{change:e=>{ settings.name=e.target.value.trim(); saveSettings(); }}}))
  ));

  /* voz */
  loadVoices();
  const vsel = h('select',{id:'voiceSel', on:{change:e=>{ settings.voiceURI=e.target.value; saveSettings(); speak('Hola, ¿cómo estás?'); }}},
    h('option',{value:''},'Automática (español)'),
    voices.map(v => h('option',{value:v.voiceURI, selected: v.voiceURI===settings.voiceURI}, `${v.name} (${v.lang})`)));
  inner.appendChild(h('section',{class:'sec'},
    h('h2',{},'Voz'),
    h('div',{class:'field'}, h('label',{for:'voiceSel'},'Voz de la tablet'), vsel),
    h('div',{class:'field'}, h('label',{},'Velocidad'),
      seg([[0.75,'Lenta'],[0.9,'Normal'],[1.05,'Rápida']], settings.rate, v => { settings.rate=v; saveSettings(); speak('Quiero tomar agua'); })),
    h('div',{class:'row2'}, h('button',{class:'sbtn', on:{click:()=>speak('Hola, ¿cómo estás?')}}, 'Probar voz')),
    h('p',{class:'note'},'Cada pictograma puede tener además una grabación con la voz de alguien de la familia (en Editar). Si tiene grabación, se usa en lugar de la voz de la tablet.')
  ));

  /* juegos */
  inner.appendChild(h('section',{class:'sec'},
    h('h2',{},'Juegos'),
    h('div',{class:'field'}, h('label',{},'Botón “Jugar”'), seg([[true,'Mostrar'],[false,'Ocultar']], settings.showGames, v => { settings.showGames=v; saveSettings(); })),
    h('div',{class:'field'}, h('label',{},'Dibujos para elegir en cada pregunta'), seg([[2,'2'],[3,'3'],[4,'4']], settings.options, v => { settings.options=v; saveSettings(); })),
    h('div',{class:'field'}, h('label',{},'Preguntas por partida'), seg([[3,'3'],[5,'5'],[8,'8']], settings.rounds, v => { settings.rounds=v; saveSettings(); })),
    h('p',{class:'note'},'Los juegos usan los pictogramas que tengan marcada la opción “Usar en los juegos”. En los juegos no hay errores que castiguen: si toca otro dibujo, el correcto se ilumina para ayudarla.')
  ));

  /* copia */
  const fileIn = h('input',{type:'file', accept:'application/json,.json', hidden:true, on:{change:async e=>{
    const f = e.target.files[0]; if (!f) return;
    try{ const d = JSON.parse(await f.text()); if (!Array.isArray(d.pictos)) throw 0; pictos = d.pictos; settings = {...DEFAULT_SETTINGS, ...(d.settings||{})}; await savePictos(); await saveSettings(); toast('Copia cargada'); openSettings(); }
    catch(_){ toast('Ese archivo no es una copia de esta app'); }
  }}});
  let resetArmed = false;
  const resetBtn = h('button',{class:'sbtn danger', on:{click:async ()=>{
    if (!resetArmed){ resetArmed = true; resetBtn.textContent = 'Tocá otra vez para borrar todo'; setTimeout(()=>{ resetArmed=false; resetBtn.textContent='Volver a empezar'; }, 4000); return; }
    pictos = freshPictos(); settings = {...DEFAULT_SETTINGS, dataVersion:DATA_VERSION}; openFolder = null; await savePictos(); await saveSettings(); cacheRemote(); toast('Listo, volvió a como estaba al principio'); openSettings();
  }}}, 'Volver a empezar');
  inner.appendChild(h('section',{class:'sec'},
    h('h2',{},'Copia de seguridad'),
    h('p',{class:'note'},'Guardá un archivo con todos los pictogramas, fotos y grabaciones. Sirve para no perderlos o para pasarlos a otra tablet (por ejemplo, la de las terapeutas).'),
    h('div',{class:'row2'},
      h('button',{class:'sbtn pri', on:{click:()=>{
        const blob = new Blob([JSON.stringify({app:'voz-antonella', version:1, settings, pictos})], {type:'application/json'});
        const a = h('a',{href:URL.createObjectURL(blob), download:`pictos-${(settings.name||'copia').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`}); document.body.appendChild(a); a.click(); a.remove();
      }}}, 'Guardar copia'),
      h('button',{class:'sbtn', on:{click:()=>fileIn.click()}}, 'Cargar copia'), fileIn, resetBtn)
  ));

  inner.appendChild(h('section',{class:'sec'},
    h('h2',{},'Para que no salga de la app'),
    h('p',{class:'note'},'En Android podés “fijar” la app: Ajustes de la tablet → Seguridad → Fijar apps (o “Fijación de pantalla”). Después abrí la app, tocá el botón de apps recientes, tocá el ícono de La voz de Antonella y elegí “Fijar”. Para salir se mantiene Atrás + Recientes.')
  ));
  inner.appendChild(h('p',{class:'credit'}, ARASAAC_CREDIT, ' ', h('a',{href:'https://arasaac.org', target:'_blank', rel:'noopener'}, 'arasaac.org')));
  sh.appendChild(inner);
}

/* editor de un pictograma */
function openEditor(p, onDone, isNew){
  const draft = JSON.parse(JSON.stringify(p));
  const sh = $('sheet'); const prev = Array.from(sh.childNodes); sh.innerHTML=''; sh.scrollTop = 0;
  const inner = h('div',{class:'inner'});
  const back = () => { sh.innerHTML=''; openSettings(); };
  const preview = h('div',{class:'preview'});
  const drawPreview = () => { preview.innerHTML=''; preview.appendChild(thumb(draft)); };
  drawPreview();

  const label = h('input',{type:'text', id:'edLabel', value:draft.label, on:{input:e=>draft.label=e.target.value}});
  const phrase = h('input',{type:'text', id:'edPhrase', value:draft.phrase, placeholder:'Ej.: Quiero tomar agua', on:{input:e=>draft.phrase=e.target.value}});

  /* buscar en ARASAAC */
  const results = h('div',{class:'results'});
  const q = h('input',{type:'search', id:'edSearch', placeholder:'Buscar dibujo (ej.: jugo, plaza, televisión)', value: isNew?'':draft.label});
  const doSearch = async () => {
    const term = q.value.trim(); if (!term) return;
    results.innerHTML = '<p class="note">Buscando…</p>';
    try{
      const r = await fetch(`https://api.arasaac.org/v1/pictograms/es/search/${encodeURIComponent(term)}`);
      if (!r.ok) throw new Error(r.status === 404 ? 'none' : 'http');
      const data = (await r.json()).slice(0, 40); results.innerHTML = '';
      if (!data.length) throw new Error('none');
      data.forEach(d => {
        const b = h('button',{type:'button','aria-pressed':String(draft.src.type==='arasaac' && draft.src.id===d._id), title:(d.keywords||[]).map(k=>k.keyword).join(', ')},
          h('img',{src:`https://static.arasaac.org/pictograms/${d._id}/${d._id}_300.png`, alt:(d.keywords&&d.keywords[0]&&d.keywords[0].keyword)||''}));
        b.addEventListener('click', () => {
          draft.src = {type:'arasaac', id:d._id, hair:!!d.hair}; draft.img = '';
          results.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); drawPreview();
        });
        results.appendChild(b);
      });
    }catch(e){
      results.innerHTML = '';
      results.appendChild(h('p',{class:'note'}, e.message==='none' ? 'No encontré dibujos con esa palabra. Probá con otra parecida.' : 'No se pudo buscar. Revisá que la tablet tenga internet.'));
    }
  };
  q.addEventListener('keydown', e => { if (e.key==='Enter') doSearch(); });

  /* foto */
  const photoIn = (capture) => h('input',{type:'file', accept:'image/*', capture: capture ? 'environment' : false, hidden:true, on:{change:async e=>{
    const f = e.target.files[0]; if (!f) return;
    try{ draft.img = await resizeImage(f, 640); draft.src = {type:'photo'}; drawPreview(); }catch(_){ toast('No se pudo usar esa imagen'); }
  }}});
  const camIn = photoIn(true), galIn = photoIn(false);

  /* grabación */
  const recState = h('span',{class:'note'}, draft.audio ? 'Tiene grabación' : 'Sin grabación');
  let rec = null, chunks = [], stopTimer = 0;
  const recBtn = h('button',{class:'sbtn pri', type:'button'}, '🎙 Grabar');
  recBtn.addEventListener('click', async () => {
    if (rec){ rec.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      rec = new MediaRecorder(stream); chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = async () => {
        clearTimeout(stopTimer); stream.getTracks().forEach(t=>t.stop());
        draft.audio = await blobToDataURL(new Blob(chunks, {type: rec.mimeType || 'audio/webm'}));
        rec = null; recBtn.textContent = '🎙 Grabar de nuevo'; recState.textContent = 'Tiene grabación'; playBtn.disabled = false; delBtn.disabled = false;
      };
      rec.start(); recBtn.textContent = '■ Terminar'; recState.textContent = 'Grabando… (hasta 6 segundos)';
      stopTimer = setTimeout(() => rec && rec.stop(), 6000);
    }catch(e){ toast('No se pudo usar el micrófono. Revisá el permiso de la app.'); }
  });
  const playBtn = h('button',{class:'sbtn', type:'button', disabled:!draft.audio, on:{click:()=>say(draft.phrase||draft.label, draft.audio)}}, '▶ Escuchar');
  const delBtn = h('button',{class:'sbtn danger', type:'button', disabled:!draft.audio, on:{click:()=>{ draft.audio=''; recState.textContent='Sin grabación'; playBtn.disabled=true; delBtn.disabled=true; }}}, 'Borrar grabación');

  const games = h('input',{type:'checkbox', id:'edGames', checked:draft.games, on:{change:e=>draft.games=e.target.checked}});

  let delArmed = false;
  const delPicto = h('button',{class:'sbtn danger', type:'button', on:{click:async ()=>{
    if (!delArmed){ delArmed = true; delPicto.textContent='Tocá otra vez para eliminar'; setTimeout(()=>{delArmed=false; delPicto.textContent='Eliminar pictograma';},4000); return; }
    pictos = pictos.filter(x => x.id !== p.id); await savePictos(); back();
  }}}, 'Eliminar pictograma');

  const save = async () => {
    draft.label = draft.label.trim() || 'Sin nombre'; draft.phrase = draft.phrase.trim();
    const i = pictos.findIndex(x => x.id === p.id);
    if (i >= 0) pictos[i] = draft; else pictos.push(draft);
    await savePictos(); toast('Guardado'); back();
    if (draft.src.type === 'arasaac' && !draft.img) cacheRemote();
  };

  inner.append(
    h('div',{class:'sheethead'}, h('h1',{}, isNew ? 'Nuevo pictograma' : 'Editar pictograma'),
      h('button',{class:'sbtn', on:{click:back}}, 'Cancelar'), h('button',{class:'sbtn pri', on:{click:save}}, 'Guardar')),
    h('section',{class:'sec'},
      h('div',{class:'row2'}, preview,
        h('div',{style:'flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px'},
          h('div',{class:'field'}, h('label',{for:'edLabel'},'Texto de la tarjeta'), label),
          h('div',{class:'field'}, h('label',{for:'edPhrase'},'Lo que dice la voz'), phrase)))
    ),
    h('section',{class:'sec'},
      h('h2',{},'Dibujo'),
      h('div',{class:'row2'}, h('button',{class:'sbtn', type:'button', on:{click:()=>camIn.click()}}, '📷 Sacar foto'), h('button',{class:'sbtn', type:'button', on:{click:()=>galIn.click()}}, '🖼 Elegir de la galería'), camIn, galIn),
      h('p',{class:'note'},'Las fotos reales (su vaso, su cama, la cara de mamá) suelen entenderse mejor que los dibujos. También podés buscar un dibujo en ARASAAC, el mismo banco que usan las terapeutas:'),
      h('div',{class:'row2'}, h('div',{class:'field',style:'flex:1;min-width:200px'}, q), h('button',{class:'sbtn pri', type:'button', on:{click:doSearch}}, 'Buscar')),
      results
    ),
    h('section',{class:'sec'},
      h('h2',{},'Voz grabada (opcional)'),
      h('p',{class:'note'},'Grabá la frase con tu voz o la de alguien de la familia. Se usa en lugar de la voz de la tablet.'),
      h('div',{class:'row2'}, recBtn, playBtn, delBtn, recState)
    ),
    h('section',{class:'sec'},
      draft.folder ? null : h('div',{class:'field'}, h('label',{},'Dónde va'),
        seg([['', 'Tablero principal'], ...folders().filter(f => f.id !== draft.id).map(f => [f.id, 'Carpeta ' + f.label])], draft.in || '', v => { draft.in = v || undefined; })),
      draft.folder ? h('p',{class:'note'},'Esta tarjeta es una carpeta: al tocarla se abren los pictogramas que tengan “Dónde va” en esta carpeta.') : h('label',{class:'row2', for:'edGames', style:'font-weight:700'}, games, 'Usar en los juegos'),
      isNew ? null : h('div',{class:'row2'}, delPicto)
    )
  );
  sh.appendChild(inner);
}
function resizeImage(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    im.onerror = rej; im.src = url;
  });
}

/* ---------- pantalla encendida ---------- */
let wake = null;
async function keepAwake(){ try{ if ('wakeLock' in navigator && document.visibilityState==='visible') wake = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', keepAwake);

/* ---------- inicio ---------- */
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!$('talkView').hidden) renderBoard(); }, 150); });
(async () => {
  await load(); applyGamesTab(); renderBoard(); keepAwake();
  cacheRemote().then(() => { if (!$('talkView').hidden) renderBoard(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:'){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
})();
